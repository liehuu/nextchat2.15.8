name: Release App

on:
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'yarn'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-latest

      - name: install frontend dependencies
        run: |
          yarn install
          yarn add -D bufferutil utf-8-validate

      - name: Patch Tauri Config for Github Actions
        shell: bash
        run: |
          node -e '
          const fs = require("fs");

          // 1. 禁用 Tauri 签名更新校验，防止因缺少私人 Key 报错挂掉
          const tauriConfPath = "src-tauri/tauri.conf.json";
          if (fs.existsSync(tauriConfPath)) {
            try {
              const conf = JSON.parse(fs.readFileSync(tauriConfPath, "utf8"));
              if (conf.tauri && conf.tauri.updater) {
                conf.tauri.updater.active = false;
                delete conf.tauri.updater.pubkey;
              }
              fs.writeFileSync(tauriConfPath, JSON.stringify(conf, null, 2));
              console.log("✅ Disabled Tauri updater signing successfully.");
            } catch (e) {
              console.error("Failed to patch tauri.conf.json:", e);
            }
          }
          '

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_MODE: export
          BUILD_APP: 1
          NEXT_TELEMETRY_DISABLED: 1
        with:
          tagName: v1.0.0
          releaseName: 'NextChat Windows Client v2.15.8'
          releaseBody: 'NextChat Windows 桌面客户端 (基于稳定版 v2.15.8 编译)'
          releaseDraft: false
          prerelease: false
